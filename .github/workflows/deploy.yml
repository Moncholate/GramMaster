name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Para poder relanzar el despliegue sin ensuciar el historial con un commit
  # vacío. Question Lab y Grammar HUB ya lo tenían; aquí faltaba, y se notó el
  # día que hizo falta.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Un solo despliegue a la vez, pero NO se cancela el que esta en curso.
  # Con `true`, empujar varios commits seguidos cancelaba el deploy a medio
  # camino y dejaba un despliegue colgado en la API de Pages; el siguiente run
  # se quedaba 10 minutos esperandolo y abortaba con "Timeout reached".
  # Es lo que dice la plantilla oficial de Pages, y por eso el arreglo de los
  # ojos nunca llego a publicarse.
  #
  # El nombre del grupo es ARBITRARIO: lo único que importa es que todos los
  # runs compartan uno. Se renombró de "pages" a "pages-deploy" el 27-ago-2026
  # para escapar de una ejecución ZOMBI: se quedó en "queued" sin llegar nunca a
  # un runner, y GitHub no dejaba cancelarla, forzarla ni borrarla — la API se
  # contradecía sola (decía "queued" y a la vez "no ha llegado a encolarse").
  # Con cancel-in-progress en false esa ejecución tenía tomado el grupo, así que
  # CUALQUIER push posterior se habría encolado detrás de ella para siempre.
  # Si vuelve a pasar, el arreglo es este mismo: cambiarle el nombre al grupo.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 como las otras tres. En 20 vitest 4 se queda al filo de su mínimo
          # (^20.19), y no hay motivo para que la app que más pruebas tiene sea
          # la que corre en el Node más viejo.
          node-version: 24
          cache: npm
      - run: npm ci

      # Los tests que esta app puede correr SOLA: 1211 de los 1225.
      #
      # Los otros 14 son los dos oráculos diferenciales, y no caben aquí por
      # diseño: `suite.parity` importa el analizador de Desgramatizador y
      # `ql.parity` el de Question Lab, con rutas `../../` que solo existen
      # donde están las cuatro carpetas juntas. Revientan a propósito si el
      # vecino no está —lo dice su cabecera— en vez de saltarse solos y dar un
      # verde que no significa nada.
      #
      # Corren en `guardias.yml` del repo de tokens, que es el único sitio donde
      # la suite entera está montada. Mismo criterio que las tres guardias de
      # contraste: lo que compara apps no vive dentro de una app.
      - run: npm run test:app

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
