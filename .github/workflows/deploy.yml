name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Un solo despliegue a la vez, pero NO se cancela el que esta en curso.
  # Con `true`, empujar varios commits seguidos cancelaba el deploy a medio
  # camino y dejaba un despliegue colgado en la API de Pages; el siguiente run
  # se quedaba 10 minutos esperandolo y abortaba con "Timeout reached".
  # Es lo que dice la plantilla oficial de Pages, y por eso el arreglo de los
  # ojos nunca llego a publicarse.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
