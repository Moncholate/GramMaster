<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
    /* Tema de la suite (compartido same-origin): fija data-theme antes de pintar.
       gh_theme = auto | light | dark. window.ghTheme = control para el toggle. */
    (function(){try{var K='gh_theme',order=['auto','light','dark'];
      var apply=function(){var m=localStorage.getItem(K)||'auto';
        var dark=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme',dark?'dark':'light');};
      window.ghTheme={get:function(){return localStorage.getItem(K)||'auto';},
        set:function(v){localStorage.setItem(K,v);apply();},
        effective:function(){return document.documentElement.getAttribute("data-theme")||"light";},
        toggle:function(){var n=this.effective()==="dark"?"light":"dark";this.set(n);return n;},apply:apply};
      apply();addEventListener('storage',function(e){if(e.key===K)apply();});
      var mq=matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
    }catch(e){}})();
    </script>
    <link rel="icon" type="image/x-icon" href="/GramMaster/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/GramMaster/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/GramMaster/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/GramMaster/apple-touch-icon.png" />
    <link rel="manifest" href="/GramMaster/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aprende inglés construyendo oraciones perfectas" />
    <!-- Vista previa al compartir el enlace. Sin og:image, WhatsApp toma el
         ícono de la app, que lleva esquinas transparentes y las pinta blancas. -->
    <meta property="og:title" content="Grammaster" />
    <meta property="og:description" content="Construye oraciones en inglés" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moncholate.github.io/GramMaster/" />
    <meta property="og:image" content="https://moncholate.github.io/GramMaster/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Grammaster</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
